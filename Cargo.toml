[package]
name = "arp-scan-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
slint = "1.14.1"

[dev-dependencies]
i-slint-backend-testing = "1.14.1"

[build-dependencies]
slint-build = "1.14.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper"] }
